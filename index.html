<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Fighting Friends</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0b0618" />
  </head>
  <body>
    <div id="app">
      <canvas id="cv"></canvas>

      <!-- commandes tactiles -->
      <div id="touch">
        <div id="stick"><div id="knob"></div></div>
        <div id="pad">
          <div class="btn p" data-b="lp">A<small>poing</small></div>
          <div class="btn p h" data-b="hp">B<small>POING</small></div>
          <div class="btn k" data-b="lk">C<small>pied</small></div>
          <div class="btn k h" data-b="hk">D<small>PIED</small></div>
        </div>
      </div>
      <button id="pauseBtn" aria-label="Pause">II</button>
      <div id="rotate">↻ Tourne ton téléphone à l'horizontale pour un écran plus grand</div>

      <!-- les menus sont montés ici par src/ui -->
      <div id="ui"></div>
      <div id="toast"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
