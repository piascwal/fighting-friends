<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Fighting Friends</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0b0618" />
    <meta name="apple-mobile-web-app-title" content="Fighting" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  </head>
  <body>
    <div id="app">
      <canvas id="cv"></canvas>

      <!-- commandes tactiles -->
      <div id="touch">
        <div id="stick"><div id="knob"></div></div>
        <div id="pad">
          <div class="btn p" data-b="lp">A<small>poing</small></div>
          <div class="btn p h" data-b="hp">B<small>POING</small></div>
          <div class="btn k" data-b="lk">C<small>pied</small></div>
          <div class="btn k h" data-b="hk">D<small>PIED</small></div>
        </div>
      </div>
      <button id="pauseBtn" aria-label="Pause">II</button>
      <!-- le jeu se joue à l'horizontale : à la verticale, ce message recouvre tout -->
      <div id="rotate">
        <div class="phone"></div>
        <p>Tourne ton téléphone<br />à l'horizontale</p>
        <button class="nav sm" id="rotateChars">
          PERSONNAGES &amp; SPRITES ▶<small>Utilisable à la verticale</small>
        </button>
      </div>

      <!-- les menus sont montés ici par src/ui -->
      <div id="ui"></div>
      <div id="toast"></div>
      <!-- nouvelle version publiée : proposition de recharger -->
      <div id="update" hidden></div>
    </div>
    <!-- filet de sécurité si le jeu ne démarre pas (cache d'une ancienne version) -->
    <script src="rescue.js"></script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
